name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Chapter code never runs here: results come from the committed _freeze/.
      # R is only needed for code-link, which adds function-reference links.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install code-link packages
        run: Rscript -e 'install.packages(c("rmarkdown", "downlit", "xml2"))'

      # If a page's source changed without re-rendering locally, this step
      # tries to execute it and fails for lack of packages, data or API keys.
      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
